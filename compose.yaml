services:
  prepare_scan_tuners_and_channels:
    image:
      isdb-scanner
    build:
      context: ./scan-tuners-and-channels
    container_name: PrepareDTV-ScanTunersAndChannels
    volumes:
      - ./mirakurun/conf:/mirakurun-config
      - ./EDCB/edcb/Setting:/edcb-setting
      # ホストのpcscdを使う。
      - type: bind
        source: /var/run/pcscd/pcscd.comm
        target: /var/run/pcscd/pcscd.comm
        read_only: true
        bind:
          create_host_path: false
    devices:
      - /dev/bus:/dev/bus
      - /dev/pxmlt8video0
      - /dev/pxmlt8video1
      - /dev/pxmlt8video2
      # - /dev/pxmlt8video3
      - /dev/pxmlt8video4
      - /dev/pxmlt8video5
      - /dev/pxmlt8video6
      - /dev/pxmlt8video7
    logging:
      # ログはjournaldで記録する。
      driver: journald
      options:
        tag: dtv-prepare-scan-tuners-and-channels
    # いわゆるPID1問題を回避するため、Tiniを使用する
    # see https://zenn.dev/sato_frontend/articles/fc49ffb2fe5dfc
    init: true

  # Note: Mirakurun公式の環境構築手順では、インストール時に `docker compose run --rm -e SETUP=true mirakurun` コマンドを実行している
  #       see https://github.com/Chinachu/Mirakurun/blob/61c4155d2535c56fbf6fd379c5e8aba779fd642b/doc/Platforms.ja.md#%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%88%E3%83%BC%E3%83%AB--%E3%82%A2%E3%83%B3%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%88%E3%83%BC%E3%83%AB--%E3%82%A2%E3%83%83%E3%83%97%E3%83%87%E3%83%BC%E3%83%88
  #       しかしソースコードを調査したところ、環境変数 `SETUP=true` は初回起動処理後にMirakurunを終了するための条件分岐のみで使用されている。
  #       see https://github.com/Chinachu/Mirakurun/blob/61c4155d2535c56fbf6fd379c5e8aba779fd642b/src/server.ts#L94-L97
  #       実際に動作検証しても、初回起動時のセットアップ処理は `docker compose up -d` コマンド実行時に自動で行われる。
  #       おそらく `docker compose up -d` コマンドでセットアップ処理を完了させたあと、生成された各種設定ファイルを手動修正させることが目的であるものと考える。
  #       よってこの手順では `docker compose run --rm -e SETUP=true mirakurun` コマンド相当の処理は省略している。
  mirakurun:
    image: mirakurun
    container_name: Mirakurun
    depends_on:
      prepare_scan_tuners_and_channels:
        condition: service_completed_successfully
    build:
      context: ./mirakurun
    environment:
      TZ: Asia/Tokyo
      DISABLE_PCSCD: "1"
      DISABLE_B25_TEST: "1"
      DOCKER_NETWORK: host
      # for debug
      LOG_LEVEL: "3"
      DEBUG: true
    # 削除してもMirakurunは正常に稼働しているように見える。
    # 何のためにある設定値なのか不明。
    # 念の為に公式に従い残しておく。
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    # 削除してもMirakurunは正常に稼働しているように見える。
    # おそらくコンテナ内のpcscdを使うために必要だが、そうであればこの構成には必要ない。
    # 念の為に公式に従い残しておく。
    device_cgroup_rules:
      - 'c *:* rmw'
    network_mode: host
    volumes:
      - ./mirakurun/run:/var/run
      - ./mirakurun/opt:/opt
      - ./mirakurun/conf:/app-config
      - ./mirakurun/data:/app-data
      # ホストのpcscdを使う。
      - type: bind
        source: /var/run/pcscd/pcscd.comm
        target: /var/run/pcscd/pcscd.comm
        read_only: true
        bind:
          create_host_path: false
    devices:
      - /dev/bus:/dev/bus
      - /dev/pxmlt8video0:/dev/pxmlt8video0
      - /dev/pxmlt8video1:/dev/pxmlt8video1
      - /dev/pxmlt8video2:/dev/pxmlt8video2
      # - /dev/pxmlt8video3:/dev/pxmlt8video3
      - /dev/pxmlt8video4:/dev/pxmlt8video4
      - /dev/pxmlt8video5:/dev/pxmlt8video5
      - /dev/pxmlt8video6:/dev/pxmlt8video6
      - /dev/pxmlt8video7:/dev/pxmlt8video7
    tmpfs:
      - /mnt/work2/tmp
    logging:
      driver: journald
      options:
        tag: dtv-mirakurun
    restart: always

  # Mirakurunの初回起動処理が完了するまで待機するためのコンテナ
  mirakurun_init:
    image: mirakurun
    container_name: Mirakurun_init_container
    build:
      context: ./mirakurun
    depends_on:
      mirakurun:
        condition: service_started
    network_mode: host
    user: 1000:1000
    command: [ "sh", "-c", "until wget -nv --spider http://127.0.0.1:40772/api/status; do sleep 3; done" ]

  # EDCBの設定ファイルを作成し、ホストのディレクトリに書き込む
  edcb_create_config:
    image: edcb:prepare.create-config
    container_name: PrepareEDCB-CreateConfigFiles
    build:
      context: ./EDCB
    depends_on:
      prepare_scan_tuners_and_channels:
        condition: service_completed_successfully
    network_mode: host
    user: 1000:1000
    volumes:
      - ./EDCB/edcb:/var/local/host_data/edcb
      - ./mirakurun/conf:/mirakurun-config:ro
    # 既存の設定ファイルがない場合のみコピーする
    command: /usr/local/bin/setup-ini.sh /var/local/host_data/edcb
    logging:
      driver: journald
      options:
        tag: dtv-prepare-edcb-create-config

  edcb:
    image: edcb
    container_name: EDCB
    build:
      context: ./EDCB
    depends_on:
      edcb_create_config:
        condition: service_completed_successfully
      mirakurun_init:
        condition: service_completed_successfully
    network_mode: host
    volumes:
      - ./EDCB/edcb/Common.ini:/var/local/edcb/Common.ini
      - ./EDCB/edcb/EpgDataCap_Bon.ini:/var/local/edcb/EpgDataCap_Bon.ini
      - ./EDCB/edcb/EpgTimerSrv.ini:/var/local/edcb/EpgTimerSrv.ini
      - ./EDCB/edcb/EpgTimerSrvDebugLog.txt:/var/local/edcb/EpgTimerSrvDebugLog.txt
      - ./EDCB/edcb/EpgTimerSrvNotify.log:/var/local/edcb/EpgTimerSrvNotify.log
      - ./EDCB/edcb/Setting:/var/local/edcb/Setting
      - /mnt/work1/records:/records1
      - /mnt/record/records/:/records2
      # EDCB/setup-ini.sh の更新も忘れずに。
      - ./EDCB/edcb/RecName_Macro.so.ini:/var/local/edcb/RecName_Macro.so.ini
      # EDCB/setup-ini.sh の更新も忘れずに。
      - ./EDCB/edcb/Write_Default.so.ini:/var/local/edcb/Write_Default.so.ini
    logging:
      driver: journald
      options:
        tag: dtv-edcb
    restart: always

  konomitv:
    image: konomitv
    container_name: KonomiTV
    build:
      context: ./KonomiTV
    depends_on:
      mirakurun_init:
        condition: service_completed_successfully
      edcb:
        condition: service_started
    user: 1000:1000
    network_mode: host
    volumes:
      - ./KonomiTV/config.yaml:/code/config.yaml
      - ./KonomiTV/server/data:/code/server/data
      - ./KonomiTV/server/logs:/code/server/logs
      - /:/host-rootfs
    devices:
      - /dev/dri:/dev/dri
    logging:
      driver: journald
      options:
        tag: dtv-konomitv
    restart: always

  amatsukaze:
    image: amatsukaze
    container_name: Amatsukaze
    build:
      context: ./Amatsukaze/docker
      dockerfile: Dockerfile
      args:
        ENABLE_FASTER_WHISPER: "0"  # Faster-Whisper-XXLを含める場合は "1" に変更
        ENABLE_VCEENCC: "0"  # VCEEncCを含める場合は "1" に変更
    network_mode: host
    environment:
      # Amatsukazeを実行するユーザーIDとグループIDを指定
      - RUN_UID=1000
      - RUN_GID=1000
    volumes:
      - ./avs:/app/avs
      - ./bat:/app/bat
      - ./config:/app/config
      - ./data:/app/data
      - ./drcs:/app/drcs
      - ./JL:/app/JL
      - ./logo:/app/logo
      - ./profile:/app/profile
      - /mnt/work1/trans:/app/input
      - /mnt/record/converted_records:/app/output
      - /mnt/work2/tmp/:/tmp
    # QSVEncC/VCEEncCを使うための設定
    # /dev/driが環境にない場合は無効化が必要
    devices:
      - /dev/dri:/dev/dri
      # CUDA/NVEncCを使うための設定
      # ホスト側にNVIDIA Graphics DriverとNVIDIA Container Toolkitのインストールが必要
      # NVIDIA GPUが環境にない場合は無効化が必要
      # deploy:
      #   resources:
      #     reservations:
      #       devices:
      #         - driver: nvidia
      #           count: all
      #           capabilities: [compute, utility, video]
    restart: always

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    network_mode: host
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/work1/records:/media1
      - /mnt/record/records:/media2
      - /mnt/record/converted_records:/media3
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      # - type: bind
      #   source: /path/to/fonts
      #   target: /usr/local/share/fonts/custom
      #   read_only: true
    devices:
      - /dev/dri:/dev/dri
    # Optional - alternative address used for autodiscovery
    # environment:
    #   - JELLYFIN_PublishedServerUrl=http://example.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always
    logging:
      driver: journald
      options:
        tag: dtv-konomitv